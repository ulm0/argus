# Argus Configuration File
#
# Single source of truth for the Go binary. Mirrors internal/config/config.go.
# `argus setup` writes the same shape under ~/.argus/config.yaml (or --dir).
#
# Secrets: change samba_password, offline_ap credentials, web.secret_key, and
# telegram tokens before exposing the device.

# ============================================================================
# Installation & paths
# ============================================================================
installation:
  target_user: pi # Linux user owning disk images (setup replaces with SUDO_USER)
  mount_dir: /mnt/gadget # USB gadget mount root
  archive_path: "" # Optional path: if set and contains TeslaCam/, listed in media UI
  boot_present_on_start: true # Call SwitchToPresent once at process start
  boot_cleanup_on_start: true # Run cleanup before present when boot_cleanup is enabled
  boot_random_chime_on_start: false # Pick random chime from configured group at boot
  boot_block_until_ready: true # Block HTTP until boot pipeline finishes

# ============================================================================
# Disk images
# ============================================================================
disk_images:
  cam_name: usb_cam.img
  lightshow_name: usb_lightshow.img
  cam_label: TeslaCam
  lightshow_label: Lightshow
  music_name: usb_music.img
  music_label: Music
  part2_enabled: true # LightShow / Chimes / Wraps (LUN1)
  chimes_enabled: true
  lightshow_enabled: true
  wraps_enabled: true
  music_enabled: true # Music LUN2
  music_fs: fat32
  boot_fsck_enabled: true

# ============================================================================
# Setup (argus setup only — empty strings use interactive / built-in defaults)
# ============================================================================
setup:
  part2_size: ""
  part3_size: ""
  reserve_size: ""

# ============================================================================
# Network
# ============================================================================
network:
  samba_password: tesla # CHANGE THIS
  samba_enabled: true # When false, Argus does not manage smbd/nmbd
  web_port: 80 # Required for captive portal

# ============================================================================
# Offline access point
# ============================================================================
offline_ap:
  enabled: true
  interface: wlan0
  ssid: Argus
  passphrase: argus1234
  channel: 6
  ipv4_cidr: 192.168.4.1/24
  dhcp_start: 192.168.4.10
  dhcp_end: 192.168.4.50
  check_interval: 20
  disconnect_grace: 30
  min_rssi: -70
  stable_seconds: 20
  ping_target: 8.8.8.8
  # While the AP fallback is up it holds the WiFi radio; every retry_seconds the
  # monitor frees it to let the STA rejoin a saved network. Lower = reconnects
  # faster after roaming, higher = AP flaps less.
  retry_seconds: 300
  virtual_interface: uap0
  force_mode: auto # auto | force_on | force_off
  # Route AP clients (e.g. the car joining the hotspot) out to the Pi's current
  # upstream (Bluetooth tethering / WiFi) via NAT. false = admin-only captive AP.
  share_internet: false

# ============================================================================
# System paths & reliability
# ============================================================================
system:
  config_file: /boot/firmware/config.txt
  samba_conf: /etc/samba/smb.conf
  reapply_sysctl_on_start: true
  # Hardware watchdog: Debian watchdog(8) + /etc/watchdog.conf (TeslaUSB-style)
  watchdog_enabled: true
  watchdog_timeout_sec: 60 # min 10 when changed via API; maps to watchdog.conf

# ============================================================================
# Web UI & uploads
# ============================================================================
web:
  secret_key: CHANGE-THIS-TO-A-RANDOM-SECRET-KEY-ON-FIRST-INSTALL # Randomized at runtime if still default
  max_lock_chime_size: 1048576
  max_lock_chime_duration: 10.0
  min_lock_chime_duration: 0.3
  speed_range_min: 0.5
  speed_range_max: 2.0
  speed_step: 0.05
  lock_chime_filename: LockChime.wav
  chimes_folder: Chimes
  boombox_folder: Boombox # Custom Boombox sounds (the car offers the first 5 alphabetically)
  lightshow_folder: LightShow
  max_upload_size_mb: 2048
  max_upload_chunk_mb: 16
  # Web UI login. Change auth_username/auth_password from the defaults below.
  auth_enabled: true
  auth_username: admin
  auth_password: argus

# ============================================================================
# Telegram (optional)
# ============================================================================
telegram:
  enabled: false
  bot_token: ""
  chat_id: ""
  offline_mode: queue
  max_queue_size: 50
  video_quality: hd

# ============================================================================
# Webhook (optional HMAC-signed HTTP callbacks)
# ============================================================================
webhook:
  enabled: false
  url: ""
  secret: ""

# ============================================================================
# Updates
# ============================================================================
update:
  auto_update: false
  check_on_startup: true
  channel: stable

# ============================================================================
# Archive (copy clips off the car onto a mounted target on a known network)
# ============================================================================
archive:
  enabled: false
  ssid: "" # Only sync on this WiFi network; empty means any connection
  target_path: "" # An already-mounted destination (CIFS share, external drive)
  include_recent: false # Also copy RecentClips, which Tesla rotates hourly

# ============================================================================
# Viewer prefs (server-persisted HUD / map / speed unit)
# ============================================================================
viewer_prefs:
  speed_unit: kph # kph | mph
  hud_scale: 1.0
  map_scale: 1.0

# ============================================================================
# Logging
# ============================================================================
log_level: debug
